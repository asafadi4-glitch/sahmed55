<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار الذكاء</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#141e30,#243b55);color:white;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(600px,100%);background:#ffffff12;border:1px solid #ffffff30;border-radius:22px;padding:24px;box-shadow:0 15px 40px #0005}h1{text-align:center}#meta{display:flex;justify-content:space-between;color:#cbd5e1;margin-bottom:15px}.question{font-size:1.35rem;line-height:1.6;min-height:100px}.answers{display:grid;gap:10px}.answers button,button{border:0;border-radius:12px;padding:14px;font-size:1rem;cursor:pointer}.answers button{background:#e2e8f0;color:#172033;text-align:right}.answers button:hover{background:#c7d2fe}.answers button:disabled{cursor:default}.answers button.correct{background:#86efac}.answers button.wrong{background:#fca5a5}.actions{text-align:center;margin-top:16px}#next{background:#60a5fa;color:#10233e;font-weight:bold}#restart{background:#a7f3d0;color:#064e3b}#result{text-align:center;font-size:1.3rem}.small{color:#cbd5e1;text-align:center}
</style></head><body><main class="card"><h1>🧠 اختبار الذكاء</h1><div id="meta"><span id="progress"></span><span id="score"></span></div><div class="question" id="q"></div><div class="answers" id="answers"></div><div class="actions"><button id="next" hidden>السؤال التالي</button><button id="restart" hidden>🔄 العب مرة أخرى</button></div><p class="small">اختبر تفكيرك في 10 أسئلة!</p></main><script>
const questions=[
{q:'ما العدد التالي؟ 2، 4، 8، 16، ؟',a:['18','24','32','30'],c:2},
{q:'كم شهرًا في السنة يحتوي على 28 يومًا؟',a:['شهر واحد','شهران','6 أشهر','كل الشهور'],c:3},
{q:'شيء كلما أخذت منه كبر، ما هو؟',a:['الحفرة','الكتاب','الماء','الظل'],c:0},
{q:'إذا كان 5 قطط تصطاد 5 فئران في 5 دقائق، كم تحتاج قطة واحدة لصيد فأر؟',a:['دقيقة','5 دقائق','25 دقيقة','10 دقائق'],c:1},
{q:'أي كلمة تختلف عن البقية؟',a:['تفاحة','موز','جزر','عنب'],c:2},
{q:'معك 3 تفاحات وأخذت منها 2، كم تفاحة معك؟',a:['1','2','3','5'],c:1},
{q:'ما الذي له عين ولا يرى؟',a:['الإنسان','الإبرة','القط','الكاميرا'],c:1},
{q:'ما العدد الذي إذا ضربته بنفسه ثم أضفت 1 صار 10؟',a:['2','3','4','5'],c:1},
{q:'أمامك بابان: أحدهما آمن والآخر خطر. حارس واحد يعرف الصحيح. ما السؤال الذي تسأله لتعرف الباب الآمن؟',a:['هل هذا الباب آمن؟','أي باب سيختار الحارس الآخر؟','لا يوجد حل','هل أنت حارس؟'],c:0},
{q:'أم أحمد لديها 4 أبناء: شمال، جنوب، شرق. ما اسم الابن الرابع؟',a:['غرب','أحمد','وسط','غير معروف'],c:1},
{q:'ما العدد التالي؟ 3، 6، 12، 24، ؟',a:['30','36','48','60'],c:2},
{q:'ما العدد التالي؟ 1، 4، 9، 16، ؟',a:['20','25','24','36'],c:1},
{q:'ما العدد التالي؟ 1، 1، 2، 3، 5، 8، ؟',a:['11','12','13','15'],c:2},
{q:'ما ناتج: 5 + 5 × 5 − 5 ؟',a:['25','45','0','50'],c:0},
{q:'كم دقيقة في ساعتين؟',a:['100','120','150','180'],c:1},
{q:'ما هو ربع العدد 200؟',a:['25','40','50','100'],c:2},
{q:'ما الشيء الذي يكتب ولا يقرأ؟',a:['القلم','الكتاب','الورقة','الطالب'],c:0},
{q:'ما الذي يمشي بلا أرجل ويبكي بلا عيون؟',a:['النهر','السحاب','الريح','القمر'],c:1},
{q:'أي كلمة تختلف عن البقية؟',a:['أحمر','أزرق','كرسي','أخضر'],c:2},
{q:'أي كلمة تختلف عن البقية؟',a:['حصان','بقرة','خروف','نسر'],c:3},
{q:'عمر الأب 40 وعمر ابنه 10. بعد كم سنة يصبح عمر الأب ضعف عمر الابن؟',a:['10','15','20','30'],c:2},
{q:'إذا كان اليوم الخميس، فما اليوم بعد 3 أيام؟',a:['السبت','الأحد','الاثنين','الجمعة'],c:1},
{q:'ما العدد الذي إذا أضفت له 15 صار ضعف نفسه؟',a:['5','10','15','30'],c:2},
{q:'كم ضلعًا للمسدس؟',a:['5','6','7','8'],c:1},
{q:'ما الشيء الذي يزيد كلما شاركته مع غيرك؟',a:['المال','الطعام','العلم','الوقت'],c:2},
{q:'أيهما أثقل: كيلو حديد أم كيلو قطن؟',a:['الحديد','القطن','متساويان','لا يمكن المعرفة'],c:2},
{q:'ما العدد التالي؟ 7، 14، 21، 28، ؟',a:['32','35','36','42'],c:1},
{q:'ما العدد التالي؟ 10، 20، 40، 80، ؟',a:['100','120','160','200'],c:2},
{q:'ما العدد التالي؟ 2، 6، 18، 54، ؟',a:['108','162','72','148'],c:1},
{q:'كم مرة يمكنك طرح 5 من 25؟',a:['مرة واحدة','4 مرات','5 مرات','6 مرات'],c:0},
{q:'ما الشيء الذي له أسنان ولا يعض؟',a:['المنشار','المشط','الثوم','الفيل'],c:1},
{q:'ما الشيء الذي له رقبة وليس له رأس؟',a:['الزجاجة','الوردة','الجبل','الكوب'],c:0},
{q:'ما ناتج: 8 ÷ 2 × 4 ؟',a:['1','8','16','32'],c:2},
{q:'ما هو أكبر عدد مكوّن من رقمين؟',a:['90','98','99','100'],c:2},
{q:'إذا كان غدًا الجمعة، فما هو اليوم أمس؟',a:['الثلاثاء','الأربعاء','الخميس','السبت'],c:1},
{q:'3 عمال يبنون جدارًا في 6 أيام. كم يومًا يحتاج 6 عمال؟',a:['2','3','6','12'],c:1},
{q:'ما العدد التالي؟ 1، 3، 6، 10، ؟',a:['13','14','15','16'],c:2},
{q:'ما الشكل الذي له 4 أضلاع متساوية وزواياه قائمة؟',a:['المستطيل','المثلث','المربع','الدائرة'],c:2},
{q:'ما الحرف التالي؟ أ، ب، ج، د، ؟',a:['و','هـ','ز','ح'],c:1}];let order=[],i=0,score=0,locked=false;const q=document.getElementById('q'),ans=document.getElementById('answers'),next=document.getElementById('next'),restart=document.getElementById('restart');function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}function start(){order=shuffle([...questions]).slice(0,10).map(x=>({q:x.q,o:shuffle(x.a.map((t,n)=>({t,ok:n===x.c})))}));i=0;score=0;restart.hidden=true;next.hidden=true;render()}function render(){locked=false;document.getElementById('progress').textContent=`السؤال ${i+1} من ${order.length}`;document.getElementById('score').textContent=`النقاط: ${score}`;q.textContent=order[i].q;ans.innerHTML='';order[i].o.forEach((s,n)=>{let b=document.createElement('button');b.textContent=s.t;b.onclick=()=>choose(n,b);ans.appendChild(b)});next.hidden=true}function choose(n,b){if(locked)return;locked=true;const buttons=[...ans.children];buttons.forEach(x=>x.disabled=true);if(order[i].o[n].ok){score++;b.classList.add('correct')}else{b.classList.add('wrong');buttons[order[i].o.findIndex(x=>x.ok)].classList.add('correct')}document.getElementById('score').textContent=`النقاط: ${score}`;next.hidden=false;next.textContent=i===order.length-1?'عرض النتيجة':'السؤال التالي'}next.onclick=()=>{i++;if(i<order.length)render();else finish()};function finish(){q.textContent=`🎉 نتيجتك ${score} من ${order.length}`;ans.innerHTML=`<p id="result">${score>=8?'عبقري! 🏆':score>=5?'ممتاز! 👏':'حاول مرة ثانية 💪'}</p>`;document.getElementById('progress').textContent='انتهى الاختبار';next.hidden=true;restart.hidden=false}restart.onclick=start;start();
</script></body></html>
